<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GrowStrong Achievers | Lead Dashboard</title><link rel="stylesheet" href="styles.css"></head><body><header><img class="brand-logo" src="growstrong-logo.png" alt="GrowStrong Achievers Kids Gym"><p>Team Lead Dashboard</p><nav><a href="index.html">New Lead</a><a href="leads.html">Team Dashboard</a></nav></header><main>
