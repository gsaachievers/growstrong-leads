<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GrowStrong Achievers | New Enquiry</title><link rel="stylesheet" href="styles.css"></head><body>
<header><img class="brand-logo" src="growstrong-logo.png" alt="GrowStrong Achievers Kids Gym"><p>Kids Gym • Grow Strong, Achieve More</p><nav><a href="index.html">New Lead</a><a href="leads.html">Team Dashboard</a></nav></header>
<main><section class="card"><h2>New Lead / Free Trial Enquiry</h2><p class="muted">Please share a few details. Our team will contact you.</p>
<form id="leadForm"><div><label for="parent">Parent Name *</label><input id="parent" maxlength="120" required></div><div><label for="mobile">Mobile Number *</label><input id="mobile" type="tel" maxlength="20" pattern="[+0-9 ()-]{8,20}" required></div><div><label for="customerEmail">Email Address *</label><input id="customerEmail" type="email" maxlength="254" autocomplete="email" required></div><div><label for="child">Child Name</label><input id="child" maxlength="120"></div><div><label for="age">Child Age</label><input id="age" type="number" min="0" max="18" step="0.5"></div><div><label for="center">Center *</label><select id="center" required><option value="">Select center</option><option>Greater Noida West</option><option>Lucknow</option></select></div><div><label for="program">Registered Program *</label><select id="program" required><option value="">Select program</option><option>Free Trial</option><option>School and Daycare Adventure Program</option><option>Summer Camp</option><option>Achiever Care</option><option>Gymnastics and Ninja Program</option></select></div><div><label for="source">How did you hear about us?</label><select id="source"><option>QR Code</option><option>Walk-in</option><option>Social Media</option><option>Referral</option><option>Society Event</option><option>Website</option><option>Other</option></select></div><div class="full"><label for="notes">Notes (optional)</label><textarea id="notes" maxlength="1000" placeholder="Anything you'd like us to know"></textarea></div><div class="full"><button id="submitBtn" type="submit">Submit Enquiry</button><div id="message" class="message" role="status" aria-live="polite"></div></div></form></section>
<section class="card"><h2>Share this form</h2><div class="qr"><img id="qr" alt="QR code linking to this form"><div><p class="muted">Print this QR code for your reception desk or events once your site is live.</p><button class="secondary" id="downloadQr">Download QR</button><p id="qrUrl" class="muted"></p></div></div></section></main><footer>GrowStrong Achievers · Customer Enquiries</footer>
<script src="config.js"></script><script type="module" src="app.js"></script></body></html>
